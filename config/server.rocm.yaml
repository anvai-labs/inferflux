# InferFlux ROCm Configuration
# Tested on AMD Radeon AI PRO R9700 (gfx1201 / RDNA 4) under WSL2

server:
  host: 0.0.0.0
  http_port: 8080
  max_concurrent: 1024
  enable_metrics: true
  enable_tracing: false

model:
  path: models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
  format: gguf
  quantization: q4_k_m

models:
  - id: tinyllama
    path: models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    format: gguf
    backend: rocm
    default: true

runtime:
  backend_priority: [rocm, cpu]

  rocm:
    enabled: true
    flash_attention:
      enabled: true
    device_id: 0

  backend_exposure:
    prefer_inferflux: false
    allow_llama_cpp_fallback: true

  capability_routing:
    allow_default_fallback: true
    require_ready_backend: true
    fallback_scope: any_compatible

  scheduler:
    max_batch_size: 16
    max_batch_tokens: 16384
    # Gather a full decode wave before launching a run-to-completion phased
    # call: measured +44% aggregate throughput at c=16 on the R9700
    # (741 -> 1067 tok/s, Qwen2.5-3B Q4_K_M) vs min_batch_size=1 /
    # batch_accumulation_ms=2, which launched solo 256-step calls whenever a
    # single request beat its wave to the queue. Cost: up to 100 ms added
    # latency for a lone request's first token (measured TTFT stays ~170 ms).
    min_batch_size: 16
    batch_accumulation_ms: 100

  tensor_parallel: 1
  mps_layers: 0

  paged_kv:
    cpu_pages: 4096
    eviction: lru

adapters: []

auth:
  api_keys:
    - key: dev-key-123
      scopes: [generate, read, admin]
  rate_limit_per_minute: 120

logging:
  level: info
  format: text
