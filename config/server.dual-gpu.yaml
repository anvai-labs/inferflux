# One endpoint: two chat models and one embedding model. Mixed CUDA + ROCm build required.
# Replace artifact paths and supply existing local INFERFLUX_API_KEYS.
# NVIDIA chat uses deliberate partial offload; measure VRAM before tuning it.
# This prepared configuration is not hardware-accepted.
server:
  host: 127.0.0.1
  http_port: 8080
models:
- id: qwen3-coder-30b
  path: /models/qwen3-coder-30b.gguf
  backend: llama_cpp_rocm
  device: rocm:0
  context_size: 65536
  gpu_layers: -1
  max_parallel_sequences: 2
  kv_cache_type: f16
  default: true
- id: qwen2.5-coder-14b
  path: /models/qwen2.5-coder-14b.gguf
  backend: llama_cpp_cuda
  device: cuda:0
  context_size: 32768
  gpu_layers: 8
  max_parallel_sequences: 2
  kv_cache_type: f16
- id: bge-small-en-v1.5
  path: /models/bge-small-en-v1.5.gguf
  backend: llama_cpp_cuda
  device: cuda:0
  context_size: 16384
  gpu_layers: -1
  max_parallel_sequences: 32
  kv_cache_type: f16
runtime:
  backend_exposure:
    prefer_inferflux: false
    allow_llama_cpp_fallback: false
  capability_routing:
    allow_default_fallback: false
    require_ready_backend: true
  scheduler:
    max_batch_size: 2
    min_batch_size: 2
    batch_accumulation_ms: 50
    decode_burst_tokens: 8
    session_handles:
      enabled: false
  disaggregated:
    decode_pool_size: 0
  paged_kv:
    cpu_pages: 256
  cuda:
    enabled: true
    flash_attention:
      enabled: true
  rocm:
    enabled: true
    flash_attention:
      enabled: true
