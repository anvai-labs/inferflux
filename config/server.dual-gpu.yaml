# Requires a mixed CUDA + ROCm build and two distinct GGUF artifacts.
# Supply INFERFLUX_API_KEYS locally. Size context/offload to measured free VRAM.
# This example is not an accepted production configuration.
server:
  host: 127.0.0.1
  http_port: 8080
models:
  - id: amd-model
    path: /models/amd-model.gguf
    backend: llama_cpp_rocm
    device: rocm:0
    context_size: 4096
    gpu_layers: 8
    max_parallel_sequences: 2
    kv_cache_type: f16
    default: true
  - id: nvidia-model
    path: /models/nvidia-model.gguf
    backend: llama_cpp_cuda
    device: cuda:0
    context_size: 4096
    gpu_layers: 8
    max_parallel_sequences: 2
    kv_cache_type: f16
runtime:
  backend_exposure:
    prefer_inferflux: false
    allow_llama_cpp_fallback: false
  capability_routing:
    allow_default_fallback: false
    require_ready_backend: true
  scheduler:
    max_batch_size: 2
    min_batch_size: 2
    batch_accumulation_ms: 50
    decode_burst_tokens: 8
    session_handles:
      enabled: false
  disaggregated:
    decode_pool_size: 0
  paged_kv:
    cpu_pages: 256
