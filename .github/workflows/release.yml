name: Release Packaging

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release

jobs:
  eligibility:
    name: Validate release source and evidence
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.validate.outputs.package }}
      publish: ${{ steps.validate.outputs.publish }}
      sha: ${{ steps.validate.outputs.sha }}
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout trusted default-branch validator
        uses: actions/checkout@v7
        with:
          # workflow_run's github.sha belongs to the default branch, unlike
          # event.workflow_run.head_sha which is still untrusted here.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate triggering CI, provenance, refs and GPU evidence
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_eligibility.py check
          --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
          --output "$GITHUB_OUTPUT"

  linux-packages:
    name: Linux (tgz/deb/rpm)
    runs-on: ubuntu-24.04
    needs: eligibility
    if: needs.eligibility.outputs.package == 'true'
    env:
      RELEASE_REF: ${{ needs.eligibility.outputs.sha }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libssl-dev \
            libyaml-cpp-dev \
            python3 \
            rpm \
            dpkg-dev \
            fakeroot

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_WEBUI=ON \
            -DENABLE_CUDA=OFF \
            -DENABLE_ROCM=OFF \
            -DENABLE_MPS=OFF \
            -DENABLE_BLAS=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_MTMD=OFF

      - name: Build binaries
        run: cmake --build build -j$(nproc) --target inferfluxd inferctl

      - name: Install staging tree
        run: cmake --install build --prefix build/install

      - name: Package (tgz/deb/rpm)
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ
          cpack --config build/CPackConfig.cmake -G DEB
          cpack --config build/CPackConfig.cmake -G RPM

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/linux
          mv inferflux-*Linux*.tar.gz artifacts/linux/ 2>/dev/null || true
          mv inferflux-*Linux*.deb artifacts/linux/ 2>/dev/null || true
          mv inferflux-*Linux*.rpm artifacts/linux/ 2>/dev/null || true
          ls -R artifacts/linux

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Smoke Linux packages
        run: python scripts/smoke_release_packages.py --packages artifacts/linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: artifacts/linux
          retention-days: 14

  # Arm64 Linux builds natively on the ubuntu-24.04-arm runner (same runner
  # agentbrowser uses for its server-linux-arm64 leg). CMAKE_SYSTEM_PROCESSOR
  # is aarch64 there, so cpack names the artifacts ...-Linux-aarch64.*.
  linux-arm64-packages:
    name: Linux arm64 (tgz/deb/rpm)
    runs-on: ubuntu-24.04-arm
    needs: eligibility
    if: needs.eligibility.outputs.package == 'true'
    env:
      RELEASE_REF: ${{ needs.eligibility.outputs.sha }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libssl-dev \
            libyaml-cpp-dev \
            python3 \
            rpm \
            dpkg-dev \
            fakeroot

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_WEBUI=ON \
            -DENABLE_CUDA=OFF \
            -DENABLE_ROCM=OFF \
            -DENABLE_MPS=OFF \
            -DENABLE_BLAS=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_MTMD=OFF

      - name: Build binaries
        run: cmake --build build -j$(nproc) --target inferfluxd inferctl

      - name: Install staging tree
        run: cmake --install build --prefix build/install

      - name: Package (tgz/deb/rpm)
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ
          cpack --config build/CPackConfig.cmake -G DEB
          cpack --config build/CPackConfig.cmake -G RPM

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/linux-arm64
          mv inferflux-*Linux-aarch64*.tar.gz artifacts/linux-arm64/ 2>/dev/null || true
          mv inferflux-*Linux-aarch64*.deb artifacts/linux-arm64/ 2>/dev/null || true
          mv inferflux-*Linux-aarch64*.rpm artifacts/linux-arm64/ 2>/dev/null || true
          ls -R artifacts/linux-arm64

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Smoke Linux arm64 packages
        run: python scripts/smoke_release_packages.py --packages artifacts/linux-arm64

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-packages
          path: artifacts/linux-arm64
          retention-days: 14

  mac-packages:
    name: macOS (tgz/pkg/dmg)
    runs-on: macos-latest
    needs: eligibility
    if: needs.eligibility.outputs.package == 'true'
    env:
      RELEASE_REF: ${{ needs.eligibility.outputs.sha }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}

      - name: Install dependencies
        run: |
          brew update --quiet
          brew install cmake ninja openssl@3 yaml-cpp

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_WEBUI=ON \
            -DENABLE_CUDA=OFF \
            -DENABLE_ROCM=OFF \
            -DENABLE_MPS=ON \
            -DENABLE_BLAS=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_MTMD=OFF \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build binaries
        run: cmake --build build -j$(sysctl -n hw.logicalcpu) --target inferfluxd inferctl

      - name: Install staging tree
        run: cmake --install build --prefix build/install

      - name: Package (tgz/pkg)
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ
          cpack --config build/CPackConfig.cmake -G productbuild
          cpack --config build/CPackConfig.cmake -G DragNDrop

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/macos
          mv inferflux-*Darwin*.tar.gz artifacts/macos/ 2>/dev/null || true
          mv inferflux-*.pkg artifacts/macos/ 2>/dev/null || true
          mv inferflux-*.dmg artifacts/macos/ 2>/dev/null || true
          ls -R artifacts/macos

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Smoke macOS packages
        run: python scripts/smoke_release_packages.py --packages artifacts/macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-packages
          path: artifacts/macos
          retention-days: 14

  windows-packages:
    name: Windows (MSI)
    runs-on: windows-latest
    needs: eligibility
    if: needs.eligibility.outputs.package == 'true'
    env:
      RELEASE_REF: ${{ needs.eligibility.outputs.sha }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}

      - name: Install dependencies
        run: |
          choco install ninja wixtoolset --no-progress

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -A x64
          -DCMAKE_BUILD_TYPE=$Env:BUILD_TYPE
          -DBUILD_SHARED_LIBS=OFF
          -DENABLE_WEBUI=ON
          -DENABLE_CUDA=OFF
          -DENABLE_ROCM=OFF
          -DENABLE_MPS=OFF
          -DENABLE_BLAS=OFF
          -DENABLE_VULKAN=OFF
          -DENABLE_MTMD=OFF

      - name: Build binaries
        shell: pwsh
        run: cmake --build build --config $Env:BUILD_TYPE --target inferfluxd inferctl

      - name: Install staging tree
        shell: pwsh
        run: cmake --install build --config $Env:BUILD_TYPE --prefix build/install

      - name: Package (WIX + ZIP)
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -G WIX
          cpack --config build/CPackConfig.cmake -G ZIP

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/windows -Force | Out-Null
          Get-ChildItem -Path . -Filter "inferflux-*.msi" | ForEach-Object { Copy-Item $_.FullName artifacts/windows/ }
          Get-ChildItem -Path . -Filter "inferflux-*.zip" | ForEach-Object { Copy-Item $_.FullName artifacts/windows/ }
          Get-ChildItem -Recurse artifacts/windows

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Smoke Windows packages
        run: python scripts/smoke_release_packages.py --packages artifacts/windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: artifacts/windows
          retention-days: 14

  manifests:
    name: Homebrew & Winget manifests
    runs-on: ubuntu-24.04
    needs: [eligibility, linux-packages, mac-packages, windows-packages]
    if: needs.eligibility.outputs.package == 'true'
    env:
      RELEASE_REF: ${{ needs.eligibility.outputs.sha }}

    steps:
      - name: Checkout (templates)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: _artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-packages
          path: _artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-packages
          path: _artifacts/windows

      - name: Render pinned Homebrew and Winget manifests
        env:
          RELEASE_TAG: ${{ needs.eligibility.outputs.tag }}
          RELEASE_VERSION: ${{ needs.eligibility.outputs.version }}
        run: >-
          python3 scripts/release_eligibility.py render
          --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_REF"
          --version "$RELEASE_VERSION" --tag "$RELEASE_TAG"
          --packages _artifacts/windows --destination artifacts/manifests

      - name: Upload manifests
        uses: actions/upload-artifact@v7
        with:
          name: manifests
          path: artifacts/manifests
          retention-days: 14

  create-release:
    name: Publish tagged release
    needs: [eligibility, linux-packages, linux-arm64-packages, mac-packages, windows-packages, manifests]
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: List assets
        run: ls -R release-assets

      - name: Generate sha256sums.txt
        # One checksums manifest for every published asset, named by basename
        # so it matches the flattened release asset list. Homebrew taps (and
        # other consumers) verify against this instead of re-downloading.
        run: |
          : > release-assets/sha256sums.txt
          find release-assets -type f ! -name sha256sums.txt -print0 |
            sort -z |
            while IFS= read -r -d '' f; do
              printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$(basename "$f")" >> release-assets/sha256sums.txt
            done
          cat release-assets/sha256sums.txt

      - name: Revalidate immutable release tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.eligibility.outputs.tag }}
          RELEASE_SHA: ${{ needs.eligibility.outputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const expected = process.env.RELEASE_SHA;
            if (!/^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/.test(tag) ||
                !/^[0-9a-f]{40}$/.test(expected)) {
              throw new Error('Invalid validated release identity');
            }
            const response = await github.rest.git.getRef({
              ...context.repo, ref: `tags/${tag}`
            });
            let object = response.data.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
              const peeled = await github.rest.git.getTag({
                ...context.repo, tag_sha: object.sha
              });
              object = peeled.data.object;
            }
            // Excessive nesting remains type 'tag' and fails closed here.
            if (object.type !== 'commit' || object.sha !== expected) {
              throw new Error('Release tag no longer resolves to the tested SHA');
            }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.eligibility.outputs.tag }}
          target_commitish: ${{ needs.eligibility.outputs.sha }}
          name: InferFlux ${{ needs.eligibility.outputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/**/* 
